# Override for hosts with an NVIDIA GPU (needs the NVIDIA Container Toolkit).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  api:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    environment:
      V2T_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
