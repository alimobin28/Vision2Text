# Reverse proxy in front of the FastAPI service.
# Nginx handles slow clients so uvicorn workers don't block waiting for bytes.

upstream v2t_api {
    server api:8000;
    keepalive 32;   # reuse connections to the backend
}

server {
    listen 80;
    server_name _;

    # Accept images up to 12 MB — a little above our 10 MB app-level limit
    # so Nginx doesn't cut the connection before we can return a 422.
    client_max_body_size 12m;

    # Give the model enough time to run on slower hardware
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;

    # Standard proxy headers so the app can see the real client IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://v2t_api;
    }

    # Prometheus scrape endpoint — you might want to lock this down
    # to your monitoring subnet in a real deployment.
    location /metrics {
        proxy_pass http://v2t_api;
    }
}
