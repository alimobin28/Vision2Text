# Serves the built React app and reverse-proxies the API.
# Nginx absorbs slow clients so uvicorn workers don't block waiting for bytes.

# At most 30 caption requests/minute per client IP (plus a burst of 10).
# Inference is expensive; this stops one client from monopolising it.
limit_req_zone $binary_remote_addr zone=v2t_caption:10m rate=30r/m;

upstream v2t_api {
    server api:8000;
    keepalive 32;   # reuse connections to the backend
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Accept images up to 12 MB — a little above our 10 MB app-level limit
    # so Nginx doesn't cut the connection before the API can return a 422.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Required for upstream keepalive to actually work.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Give the model enough time to run on slower hardware
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;

    # Standard proxy headers so the app can see the real client IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- API ----------------------------------------------------------
    location = /caption {
        limit_req        zone=v2t_caption burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://v2t_api;
    }

    location = /health {
        proxy_pass http://v2t_api;
    }

    # Prometheus metrics are NOT exposed to the internet. Scrape the API
    # directly from inside the Docker network:  http://api:8000/metrics
    location = /metrics {
        return 404;
    }

    # ---- Frontend -------------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
