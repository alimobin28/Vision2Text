# ---------------------------------------------------------------------------
# How to run:
#   1. Train (python train.py) -> it writes outputs/model.pt, a single file
#      containing the weights, architecture and tokenizer.
#   2. mkdir -p checkpoints && cp outputs/model.pt checkpoints/model.pt
#   3. docker compose up --build         ->  http://localhost
#
# Smoke-test once the stack is up:
#   curl http://localhost/health
#   curl -X POST http://localhost/caption \
#        -F "file=@/path/to/your/image.jpg" -F "beam_size=4"
#
# GPU host:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# ---------------------------------------------------------------------------

services:

  # ---- FastAPI inference service (internal; reachable only through nginx) ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The model lives outside the image — mount it read-only so you can swap
    # checkpoints without rebuilding.
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    environment:
      V2T_CHECKPOINT: checkpoints/model.pt
      V2T_DEVICE: cpu          # "cuda" with docker-compose.gpu.yml
      V2T_WORKERS: "2"         # inference threads
    expose:
      - "8000"
    # Healthy only once /health returns 200, i.e. the model has loaded.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 90s        # give the model time to load
      retries: 3
    restart: unless-stopped

  # ---- Nginx: serves the React build + proxies /caption and /health ----------
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
