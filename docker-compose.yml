version: "3.9"

# ---------------------------------------------------------------------------
# How to run:
#   1. Put your trained checkpoint at  ./checkpoints/best.ckpt
#   2. Put your vocab file at          ./cache/vocab.json
#   3. docker compose up --build
#
# Curl smoke-test once the stack is up:
#   curl -X POST http://localhost/caption \
#        -F "file=@/path/to/your/image.jpg" \
#        -F "beam_size=4"
# ---------------------------------------------------------------------------

services:

  # ---- FastAPI inference service ----------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Model weights and vocab live outside the image — mount them read-only
    # so you can swap checkpoints without rebuilding.
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./cache:/app/cache:ro
    environment:
      V2T_CHECKPOINT: checkpoints/best.ckpt
      V2T_VOCAB_PATH: cache/vocab.json
      V2T_DEVICE: cpu          # change to "cuda" if the host has a GPU
      V2T_WORKERS: "2"         # ThreadPoolExecutor slots for beam search
    # Docker won't mark this service healthy until /health returns 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 90s        # give the model time to load
      retries: 3
    restart: unless-stopped

  # ---- Nginx reverse proxy -----------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Only start nginx after the API is actually healthy
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
